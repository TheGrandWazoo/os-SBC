# What the `deps` workflow builds, and against which OPNsense release (#5).
# Changing this file on `next` rebuilds and republishes the "deps" release,
# which TheGrandWazoo/opnsense-repo puts on every track (ADR-SBC-0009).

# OPNsense series and the exact release whose ports tree, build settings and
# binary packages we build against (opnsense/ports and opnsense/tools tags).
OPNSENSE_SERIES="26.7"
OPNSENSE_RELEASE="26.7.10"

# OPNsense's package signing fingerprint for this series
# (opnsense/core src/etc/pkg/fingerprints/OPNsense/trusted/).
OPNSENSE_FINGERPRINT="pkg.opnsense.org.20260608"

# Ports to build. Their runtime dependencies that OPNsense does not ship are
# packaged and published with them; everything else comes from OPNsense.
PORTS="net/kamailio net/rtpproxy"
