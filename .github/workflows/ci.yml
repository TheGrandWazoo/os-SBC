# CI for os-SBC (ADR-SBC-0007).
#
# lint, test and build are the required checks on `next` and `release/*`
# (ADR-SBC-0004). Job names must not change without updating the ruleset.
# Actions are pinned to commit SHAs; Dependabot keeps them current.

name: CI

on:
  push:
    branches: [next, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [next, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPNSENSE_SERIES: "26.7"     # opnsense/core and opnsense/plugins stable/<series>
  FREEBSD_RELEASE: "15.1"     # base of OPNsense 26.7
  PHP_VERSION: "8.5"          # PHP shipped with OPNsense 26.7
  RUFF_VERSION: "0.17.6"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpcs
          coverage: none

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install xmllint and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils shellcheck

      - name: Download actionlint and gitleaks (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C bin actionlint
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || status=1
          done < <(find src -type f \( -name '*.php' -o -name '*.inc' \) -print0)
          exit "$status"

      - name: PHP style (PSR-12)
        # Advisory until the 2019 Asterisk code is removed (#11); #11 makes it blocking.
        run: |
          if ! phpcs --standard=PSR12 --extensions=php,inc --report=summary src; then
            echo "::warning::PSR-12 violations found; this step becomes blocking with #11"
          fi

      - name: XML well-formed
        run: find src -type f -name '*.xml' -print0 | xargs -0 -r xmllint --noout

      - name: Shell scripts
        run: find src .github -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

      - name: Python (ruff)
        run: uvx "ruff@${RUFF_VERSION}" check .

      - name: Workflows (actionlint)
        run: actionlint

      - name: Secrets (gitleaks)
        run: gitleaks git --redact --no-banner .

      - name: Docs (IDs, references, coverage)
        run: uv run tools/check_docs.py

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: pytest
        run: uv run --no-project --with pytest --with pyyaml pytest -q tests

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and package in a FreeBSD VM, the way opnsense/plugins does
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          envs: OPNSENSE_SERIES
          usesh: true
          prepare: |
            pkg install -y git php85 libxml2
          run: sh .github/scripts/build-plugin.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-sbc-packages
          path: work/pkg/*.pkg
          if-no-files-found: error
          retention-days: 14
